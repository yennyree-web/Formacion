<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Trabajo - Control Conectado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #059669; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased relative">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const GOOGLE_SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbwLhH59xIOrTMyk1HDvX8hM2Zn5LIIU3anIXGVRcrlClM8YcW_VvY7tNyemhl2ce4vIgg/exec";

    const DEPENDENCIAS = [
      { codigo: "OTC", nombre: "OTC (Tecnología Curricular)" },
      { codigo: "OGF", nombre: "OGF (Gestión de Formación)" },
      { codigo: "GFT", nombre: "Gerencia de Formación Tecnológica" }
    ];

    const COLABORADORES = [
      { nombre: "Diosmary Cedeño", pin: "2345" },
      { nombre: "Leonel Roman", pin: "6789" },
      { nombre: "Luis Salas", pin: "0123" },
      { nombre: "Maryorie Orellana", pin: "0456" },
      { nombre: "Rebeca Ochoa", pin: "1311" },
      { nombre: "Fredes De Paz", pin: "5678" },
      { nombre: "Betsy Freire", pin: "9123" },
      { nombre: "Maikelys Martinez", pin: "4567" },
      { nombre: "Gabriel Rodriguez", pin: "8912" },
      { nombre: "Isabel Cassino", pin: "3456" },
      { nombre: "Gabriela Torres", pin: "7891" }
    ];

    const PROYECTOS = [
      "Plataforma SIGMA",
      "Red S3",
      "Diseño Instruccional ATI",
      "Diseño Grafico",
      "Tamanaco",
      "ACA"
    ];

    const formatearFechaHora = (fechaStr) => {
      if (!fechaStr) return "";
      try {
        const dateObj = new Date(fechaStr);
        if (isNaN(dateObj.getTime())) return fechaStr;
        const dia = String(dateObj.getDate()).padStart(2, '0');
        const mes = String(dateObj.getMonth() + 1).padStart(2, '0');
        const anio = dateObj.getFullYear();
        const hora = String(dateObj.getHours()).padStart(2, '0');
        const min = String(dateObj.getMinutes()).padStart(2, '0');
        return `${dia}/${mes}/${anio} ${hora}:${min}`;
      } catch (e) {
        return fechaStr;
      }
    };

    function App() {
      const [tasks, setTasks] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      
      const [role, setRole] = useState('none'); 
      const [activeWorker, setActiveWorker] = useState('');
      const [currentSupervisorData, setCurrentSupervisorData] = useState(null);
      
      const [selectedOfficeView, setSelectedOfficeView] = useState('OTC');

      const [validadoresDinamicos, setValidadoresDinamicos] = useState(() => {
        const localData = localStorage.getItem('tw_validadores');
        return localData ? JSON.parse(localData) : [];
      });

      const [selectedWorkerPending, setSelectedWorkerPending] = useState(null);
      const [workerPinInput, setWorkerPinInput] = useState('');
      const [workerPinError, setWorkerPinError] = useState('');
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState('');

      const [showCreateModal, setShowCreateModal] = useState(false);
      const [showBulkModal, setShowBulkModal] = useState(false);
      const [bulkLoading, setBulkLoading] = useState(false);

      const [showReportModal, setShowReportModal] = useState(false);
      const [showCommentModal, setShowCommentModal] = useState(false);
      const [showManagerModal, setShowManagerModal] = useState(false);
      const [showDailyReportModal, setShowDailyReportModal] = useState(false);

      const [fechaDesde, setFechaDesde] = useState(new Date().toISOString().split('T')[0]);
      const [fechaHasta, setFechaHasta] = useState(new Date().toISOString().split('T')[0]);
      const [reporteDiarioData, setReporteDiarioData] = useState([]);

      const [reportProjectFilter, setReportProjectFilter] = useState('Todos');
      const [reportWorkerFilter, setReportWorkerFilter] = useState('Todos');

      const [selectedTask, setSelectedTask] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');
      const [projectFilter, setProjectFilter] = useState('Todos');
      const [statusFilter, setStatusFilter] = useState('Todos');
      const [workerFilter, setWorkerFilter] = useState('Todos');
      const [supervisorFilter, setSupervisorFilter] = useState('Todos');

      const [nuevoValidador, setNuevoValidador] = useState({
        nombreValidador: COLABORADORES[0].nombre,
        pin: '',
        asignados: []
      });

      const [newTask, setNewTask] = useState({
        oficina: 'OTC',
        project: PROYECTOS[0],
        accionEspecifica: '',
        title: '',
        producto: '',
        workers: [COLABORADORES[0].nombre],
        startDate: new Date().toISOString().split('T')[0],
        endDate: '',
        tiempoEjecucion: ''
      });

      const [reportData, setReportData] = useState({
        status: 'Pendiente',
        dailyAdvance: '',
        observation: '',
        adjunto: '',
        tiempoEjecucion: ''
      });

      const [supervisorCommentText, setSupervisorCommentText] = useState('');

      useEffect(() => {
        localStorage.setItem('tw_validadores', JSON.stringify(validadoresDinamicos));
      }, [validadoresDinamicos]);

      const fetchTasks = async () => {
        setLoading(true);
        setError(null);
        try {
          const response = await fetch(GOOGLE_SHEETS_API_URL);
          if (!response.ok) throw new Error("Error al consultar la API.");
          const data = await response.json();
          setTasks(Array.isArray(data) ? data : []);
        } catch (err) {
          console.error(err);
          setError("Error en la sincronización.");
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        if (GOOGLE_SHEETS_API_URL !== "TU_URL_AQUI") {
          fetchTasks();
        }
      }, []);

      const fetchReporteDiario = async (desdeCustom, hastaCustom) => {
        try {
          const d = desdeCustom || fechaDesde;
          const h = hastaCustom || fechaHasta;
          const baseUrl = GOOGLE_SHEETS_API_URL.split('?')[0];
          const urlConsulta = `${baseUrl}?action=getReporteDiario&desde=${d}&hasta=${h}`;

          const response = await fetch(urlConsulta);
          const data = await response.json();

          setReporteDiarioData(Array.isArray(data) ? data : []);
          setReportProjectFilter('Todos');
          setReportWorkerFilter('Todos');
          setShowDailyReportModal(true);
        } catch (err) {
          alert("Error al cargar el reporte: " + err.message);
        }
      };

      const downloadPDF = () => {
        if (reporteDiarioData.length === 0) {
          alert("No hay datos para exportar en el rango seleccionado.");
          return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        doc.setFontSize(16);
        doc.setTextColor(15, 23, 42);
        doc.text("Reporte Diario de Actividades", 14, 20);

        doc.setFontSize(10);
        doc.setTextColor(100, 116, 139);
        doc.text(`Desde: ${fechaDesde}  Hasta: ${fechaHasta}`, 14, 28);

        const dataFiltradaExport = reporteDiarioData.filter(r => {
          const projVal = r.proyecto || r.project || "";
          const workVal = r.responsable || r.worker || "";
          const matchProj = reportProjectFilter === 'Todos' || projVal === reportProjectFilter;
          const matchWork = reportWorkerFilter === 'Todos' || workVal.toLowerCase().includes(reportWorkerFilter.toLowerCase());
          return matchProj && matchWork;
        });

        const tableColumn = ["Dependencia", "Fecha / Hora", "Proyecto", "Acción Específica", "Actividad", "Responsable(s)", "Estatus"];
        const tableRows = dataFiltradaExport.map(r => [
          r.oficina || "OTC",
          formatearFechaHora(r.fecha || r.lastUpdated || ""),
          r.proyecto || r.project || "",
          r.accionEspecifica || "",
          r.title || r.actividad || "",
          r.responsable || r.worker || "",
          r.estatus || r.status || ""
        ]);

        doc.autoTable({
          head: [tableColumn],
          body: tableRows,
          startY: 35,
          theme: 'grid',
          styles: { fontSize: 7, cellPadding: 2.5 },
          headStyles: { fillColor: [79, 70, 229] }
        });

        doc.save(`Reporte_Desde_${fechaDesde}_Hasta_${fechaHasta}.pdf`);
      };

      const downloadODS = () => {
        if (reporteDiarioData.length === 0) {
          alert("No hay datos para exportar en el rango seleccionado.");
          return;
        }

        const dataFiltradaExport = reporteDiarioData.filter(r => {
          const projVal = r.proyecto || r.project || "";
          const workVal = r.responsable || r.worker || "";
          const matchProj = reportProjectFilter === 'Todos' || projVal === reportProjectFilter;
          const matchWork = reportWorkerFilter === 'Todos' || workVal.toLowerCase().includes(reportWorkerFilter.toLowerCase());
          return matchProj && matchWork;
        });

        let xmlContent = '<?xml version="1.0" encoding="UTF-8"?>\n';
        xmlContent += '<?mso-application progid="Excel.Sheet"?>\n';
        xmlContent += '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"\n';
        xmlContent += ' xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n';
        xmlContent += '<Styles>\n';
        xmlContent += '<Style ss:ID="Header">\n';
        xmlContent += '<Font ss:Bold="1" ss:Color="#FFFFFF"/>\n';
        xmlContent += '<Interior ss:Color="#4F46E5" ss:Pattern="Solid"/>\n';
        xmlContent += '</Style>\n';
        xmlContent += '</Styles>\n';
        xmlContent += '<Worksheet ss:Name="Reporte Diario">\n';
        xmlContent += '<Table>\n';

        xmlContent += '<Row><Cell ss:StyleID="Header"><Data ss:Type="String">Dependencia</Data></Cell>' +
                    '<Cell ss:StyleID="Header"><Data ss:Type="String">Fecha / Hora</Data></Cell>' +
                    '<Cell ss:StyleID="Header"><Data ss:Type="String">Proyecto</Data></Cell>' +
                    '<Cell ss:StyleID="Header"><Data ss:Type="String">Acción Específica</Data></Cell>' +
                    '<Cell ss:StyleID="Header"><Data ss:Type="String">Actividad</Data></Cell>' +
                    '<Cell ss:StyleID="Header"><Data ss:Type="String">Responsable(s)</Data></Cell>' +
                    '<Cell ss:StyleID="Header"><Data ss:Type="String">Estatus</Data></Cell></Row>\n';

        dataFiltradaExport.forEach(r => {
          const oficinaVal = String(r.oficina || "OTC").replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const fechaVal = String(formatearFechaHora(r.fecha || r.lastUpdated || "")).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const proyectoVal = String(r.proyecto || r.project || "").replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const accionVal = String(r.accionEspecifica || "").replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const actividadVal = String(r.title || r.actividad || "").replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const responsableVal = String(r.responsable || r.worker || "").replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const estatusVal = String(r.estatus || r.status || "").replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

          xmlContent += `<Row>` +
                        `<Cell><Data ss:Type="String">${oficinaVal}</Data></Cell>` +
                        `<Cell><Data ss:Type="String">${fechaVal}</Data></Cell>` +
                        `<Cell><Data ss:Type="String">${proyectoVal}</Data></Cell>` +
                        `<Cell><Data ss:Type="String">${accionVal}</Data></Cell>` +
                        `<Cell><Data ss:Type="String">${actividadVal}</Data></Cell>` +
                        `<Cell><Data ss:Type="String">${responsableVal}</Data></Cell>` +
                        `<Cell><Data ss:Type="String">${estatusVal}</Data></Cell>` +
                        `</Row>\n`;
        });

        xmlContent += '</Table>\n</Worksheet>\n</Workbook>';

        const blob = new Blob([xmlContent], { type: 'application/vnd.oasis.opendocument.spreadsheet;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Reporte_Desde_${fechaDesde}_Hasta_${fechaHasta}.ods`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const saveTaskToSheets = async (taskData) => {
        try {
          const payload = { action: "create", ...taskData };
          const response = await fetch(GOOGLE_SHEETS_API_URL, {
            method: "POST",
            mode: "cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          });
          const result = await response.json();
          if (result.status === "success") {
            await fetchTasks();
          }
        } catch (err) {
          alert("Error al crear: " + err.message);
        }
      };

      const updateTaskInSheets = async (taskId, updatedFields) => {
        try {
          const payload = { action: "update", id: taskId, ...updatedFields };
          await fetch(GOOGLE_SHEETS_API_URL, {
            method: "POST",
            mode: "cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          });
        } catch (err) {
          console.error("Error al guardar en Sheets:", err);
        }
      };

      const saveSupervisorComment = async (taskId, commentText) => {
        try {
          const payload = { action: "comment", id: taskId, supervisorComments: commentText };
          const response = await fetch(GOOGLE_SHEETS_API_URL, {
            method: "POST",
            mode: "cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          });
          const result = await response.json();
          if (result.status === "success") {
            setTasks(prev => prev.map(t => t.id === taskId ? { ...t, supervisorComments: commentText, lastUpdated: new Date().toISOString() } : t));
          }
        } catch (err) {
          alert("Error al guardar validación: " + err.message);
        }
      };

      const deleteTaskFromSheets = async (taskId) => {
        try {
          const payload = { action: "delete", id: taskId };
          await fetch(GOOGLE_SHEETS_API_URL, {
            method: "POST",
            mode: "cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          });
          setTasks(prev => prev.filter(t => t.id !== taskId));
        } catch (err) {
          alert("Error al eliminar: " + err.message);
        }
      };

      const handleSupervisorLogin = (e) => {
        e.preventDefault();
        const PINS_GERENCIA = {
          "1214": "Yenny Lizarraga", // OTC
          "5566": "Dulce Contrera",  // OGF
          "6677": "Isabel Cassino",
          "7788": "Supervisor"
        };

        if (PINS_GERENCIA[pinInput]) {
          const nombreSup = PINS_GERENCIA[pinInput];
          setRole('supervisor');
          setActiveWorker('');
          
          if (nombreSup === "Dulce Contrera") {
            setSelectedOfficeView('OGF');
          } else if (nombreSup === "Yenny Lizarraga") {
            setSelectedOfficeView('OTC');
          }

          setCurrentSupervisorData({ 
            tipo: "Principal", 
            titulo: `Monitoreo Global - ${nombreSup}`, 
            asignados: "Todos" 
          });
          setPinError('');
          setPinInput('');
          return;
        }

        const matchSup = validadoresDinamicos.find(s => String(s.pin).trim() === String(pinInput).trim());
        if (matchSup) {
          setRole('supervisor');
          setActiveWorker('');
          setCurrentSupervisorData(matchSup);
          setPinError('');
          setPinInput('');
        } else {
          setPinError('PIN no reconocido.');
        }
      };

      const handleWorkerPinSubmit = (e) => {
        e.preventDefault();
        if (!selectedWorkerPending) return;
        if (workerPinInput === selectedWorkerPending.pin) {
          setRole('trabajador');
          setActiveWorker(selectedWorkerPending.nombre);
          setCurrentSupervisorData(null);
          setSelectedWorkerPending(null);
          setWorkerPinInput('');
        } else {
          setWorkerPinError('PIN incorrecto.');
        }
      };

      const handleToggleNewTaskWorker = (nombre) => {
        setNewTask(prev => {
          const exists = prev.workers.includes(nombre);
          let updated;
          if (exists) {
            if (prev.workers.length === 1) return prev; // Mantener al menos uno
            updated = prev.workers.filter(w => w !== nombre);
          } else {
            updated = [...prev.workers, nombre];
          }
          return { ...prev, workers: updated };
        });
      };

      const handleCreateTask = (e) => {
        e.preventDefault();
        const workerString = newTask.workers.join(', ');
        const taskData = {
          oficina: newTask.oficina,
          project: newTask.project,
          accionEspecifica: newTask.accionEspecifica,
          title: newTask.title,
          producto: newTask.producto,
          worker: workerString,
          startDate: newTask.startDate,
          endDate: newTask.endDate,
          tiempoEjecucion: newTask.tiempoEjecucion,
          status: 'Pendiente',
          dailyAdvance: '',
          observation: '',
          adjunto: ''
        };
        saveTaskToSheets(taskData);
        setShowCreateModal(false);
        setNewTask({ oficina: 'OTC', project: PROYECTOS[0], accionEspecifica: '', title: '', producto: '', workers: [COLABORADORES[0].nombre], startDate: new Date().toISOString().split('T')[0], endDate: '', tiempoEjecucion: '' });
      };

      const handleAgregarValidador = (e) => {
        e.preventDefault();
        if (!nuevoValidador.pin.trim() || nuevoValidador.asignados.length === 0) {
          alert("Por favor, ingresa un PIN y selecciona al menos un colaborador asignado.");
          return;
        }

        const nuevoRegistro = {
          tipo: `Validador Técnico (${nuevoValidador.nombreValidador.split(' ')[0]})`,
          pin: nuevoValidador.pin.trim(),
          titulo: `Panel de Validación de ${nuevoValidador.nombreValidador}`,
          asignados: nuevoValidador.asignados
        };

        setValidadoresDinamicos(prev => {
          const filtrados = prev.filter(v => v.pin !== nuevoValidador.pin);
          return [...filtrados, nuevoRegistro];
        });

        setNuevoValidador({ nombreValidador: COLABORADORES[0].nombre, pin: '', asignados: [] });
        alert("Estructura de validación guardada con éxito.");
      };

      const handleToggleAsignado = (nombre) => {
        setNuevoValidador(prev => {
          const yaAsignado = prev.asignados.includes(nombre);
          return {
            ...prev,
            asignados: yaAsignado 
              ? prev.asignados.filter(n => n !== nombre)
              : [...prev.asignados, nombre]
          };
        });
      };

      const openReportModal = (task) => {
        const taskClone = JSON.parse(JSON.stringify(task));
        setSelectedTask(taskClone);
        setReportData({
          status: String(taskClone.status || 'Pendiente'),
          dailyAdvance: String(taskClone.dailyAdvance || ''), 
          observation: String(taskClone.observation || ''),
          adjunto: String(taskClone.adjunto || ''),
          tiempoEjecucion: String(taskClone.tiempoEjecucion || '')
        });
        setShowReportModal(true);
      };

      const handleSaveReport = (e) => {
        e.preventDefault();
        if (!selectedTask) return;

        const targetId = selectedTask.id;
        const updatedFields = {
          status: reportData.status,
          dailyAdvance: reportData.dailyAdvance,
          observation: reportData.observation,
          adjunto: reportData.adjunto,
          tiempoEjecucion: reportData.tiempoEjecucion
        };

        updateTaskInSheets(targetId, updatedFields);

        setTasks(prevTasks => prevTasks.map(t => {
          if (String(t.id).replace(/[\s-]+/g, '').toUpperCase() === String(targetId).replace(/[\s-]+/g, '').toUpperCase()) {
            return { ...t, ...updatedFields, lastUpdated: new Date().toISOString() };
          }
          return t;
        }));

        setShowReportModal(false);
        setSelectedTask(null);
      };

      const openCommentModal = (task) => {
        setSelectedTask(task);
        setSupervisorCommentText(task.supervisorComments || '');
        setShowCommentModal(true);
      };

      const handleSaveComment = (e) => {
        e.preventDefault();
        if (!selectedTask) return;
        saveSupervisorComment(selectedTask.id, supervisorCommentText);
        setShowCommentModal(false);
        setSelectedTask(null);
      };

      let scopeTasks = tasks;
      if (selectedOfficeView !== 'TODAS') {
        scopeTasks = tasks.filter(t => {
          let oficinaTarea = String(t.oficina || "").trim().toUpperCase();
          return oficinaTarea === selectedOfficeView.toUpperCase();
        });
      }

      if (role === 'trabajador') {
        scopeTasks = scopeTasks.filter(t => {
          const workersField = String(t.worker || t.responsable || "").toLowerCase();
          return workersField.includes(activeWorker.trim().toLowerCase());
        });
      } else if (role === 'supervisor' && currentSupervisorData && currentSupervisorData.asignados !== "Todos") {
        scopeTasks = scopeTasks.filter(t => {
          const workersField = String(t.worker || t.responsable || "");
          return currentSupervisorData.asignados.some(collab => workersField.includes(collab));
        });
      }

      const filteredTasks = scopeTasks.filter(t => {
        const projVal = t.project || t.proyecto || "";
        const statVal = t.status || t.estatus || "";
        const workerVal = t.worker || t.responsable || "";
        
        let supervisorAsignado = t.oficina === 'OGF' ? "Dulce Contrera" : "Yenny Lizarraga";

        const matchProject = projectFilter === 'Todos' || projVal === projectFilter;
        const matchStatus = statusFilter === 'Todos' || statVal === statusFilter;
        const matchWorker = workerFilter === 'Todos' || workerVal.toLowerCase().includes(workerFilter.toLowerCase());
        const matchSupervisor = supervisorFilter === 'Todos' || supervisorAsignado === supervisorFilter;

        const term = searchTerm.toLowerCase();
        const matchSearch = searchTerm === '' || 
          String(t.accionEspecifica || "").toLowerCase().includes(term) || 
          String(t.title || t.actividad || "").toLowerCase().includes(term) || 
          String(projVal).toLowerCase().includes(term) || 
          String(workerVal).toLowerCase().includes(term);

        return matchProject && matchStatus && matchWorker && matchSupervisor && matchSearch;
      });

      const stats = {
        total: scopeTasks.filter(t => (t.status || t.estatus) !== 'Listo').length,
        completadas: scopeTasks.filter(t => (t.status || t.estatus) === 'Listo').length,
        enDesarrollo: scopeTasks.filter(t => (t.status || t.estatus) === 'En desarrollo').length,
        bloqueadas: scopeTasks.filter(t => (t.status || t.estatus) === 'Retrasado').length,
        pendientes: scopeTasks.filter(t => (t.status || t.estatus) === 'Pendiente').length
      };

      const reporteDiarioFiltrado = reporteDiarioData.filter(r => {

                  <br /><code className="text-indigo-600 font-bold">Oficina | Proyecto | Acción Específica | Actividad | Producto | Responsable | Fecha Inicio | Fecha Fin | Tiempo</code>

                      accept=".csv, .ods, .xlsx, .xls" 
                      onChange={async (e) => {
                        const file = e.target.files[0];
                        if (!file) return;

                        setBulkLoading(true);
                        try {
                          const text = await file.text();
                          const lines = text.split('\n');
                          const tasksToUpload = [];

                          for (let line of lines) {
                            if (!line.trim()) continue;
                            const parts = line.includes('\t') ? line.split('\t') : line.split(',');
                            if (parts.length >= 6) {
                              tasksToUpload.push({
                                oficina: String(parts[0] || 'OTC').trim().toUpperCase(),
                                project: String(parts[1] || PROYECTOS[0]).trim().replace(/"/g, ''),
                                accionEspecifica: String(parts[2] || 'General').trim().replace(/"/g, ''),
                                title: String(parts[3] || 'Sin título').trim().replace(/"/g, ''),
                                producto: parts[4] ? String(parts[4]).trim().replace(/"/g, '') : '',
                                worker: parts[5] ? String(parts[5]).trim().replace(/"/g, '') : COLABORADORES[0].nombre,
                                startDate: parts[6] ? String(parts[6]).trim().replace(/"/g, '') : new Date().toISOString().split('T')[0],
                                endDate: parts[7] ? String(parts[7]).trim().replace(/"/g, '') : '',
                                tiempoEjecucion: parts[8] ? String(parts[8]).trim().replace(/"/g, '') : '',
                                status: 'Pendiente'
                              });
                            }
                          }

                          if (tasksToUpload.length === 0) {
                            alert("No se pudieron leer registros válidos en el archivo.");
                            setBulkLoading(false);
                            return;
                          }

                          const payload = { action: "bulkCreate", tasks: tasksToUpload };
                          const response = await fetch(GOOGLE_SHEETS_API_URL, {
                            method: "POST",
                            mode: "cors",
                            headers: { "Content-Type": "text/plain" },
                            body: JSON.stringify(payload)
                          });
                          const result = await response.json();

                          if (result.status === "success") {
                            alert(`¡Carga de archivo exitosa! Se guardaron ${result.count} tareas en Google Sheets.`);
                            setShowBulkModal(false);
                            await fetchTasks();
                          } else {
                            alert("Error en el servidor: " + (result.message || "Desconocido"));
                          }
                        } catch (err) {
                          alert("Error al procesar el archivo: " + err.message);
                        } finally {
                          setBulkLoading(false);
                        }
                      }}
                      className="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                    />

                  <div><label className="block text-xs font-semibold mb-1">Producto Esperado</label><input type="text" value={newTask.producto} onChange={e => setNewTask({...newTask, producto: e.target.value})} className="w-full border rounded-lg p-2 text-xs" /></div>
                  
                  <div>
                    <label className="block text-xs font-semibold mb-1.5">Responsable(s) (Selecciona uno o más)</label>
                    <div className="grid grid-cols-2 gap-2 max-h-36 overflow-y-auto border border-slate-200 p-2 rounded-lg bg-slate-50">
                      {COLABORADORES.map(c => {
                        const isChecked = newTask.workers.includes(c.nombre);
                        return (
                          <button 
                            type="button" 
                            key={`new-w-${c.nombre}`} 
                            onClick={() => handleToggleNewTaskWorker(c.nombre)}
                            className={`text-left p-1.5 rounded border text-[11px] font-medium flex items-center justify-between ${isChecked ? 'bg-indigo-50 border-indigo-400 text-indigo-950 font-bold' : 'bg-white text-slate-700'}`}
                          >
                            <span className="truncate">{c.nombre}</span>
                            <span>{isChecked ? '✅' : '➕'}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div><label className="block text-xs font-semibold mb-1">Fecha Entrega</label><input type="date" value={newTask.endDate} onChange={e => setNewTask({...newTask, endDate: e.target.value})} className="w-full border rounded-lg p-2 text-xs" /></div>
                    <div><label className="block text-xs font-semibold mb-1">Tiempo Estimado</label><input type="text" placeholder="Ej: 3 días" value={newTask.tiempoEjecucion} onChange={e => setNewTask({...newTask, tiempoEjecucion: e.target.value})} className="w-full border rounded-lg p-2 text-xs" /></div>
                  </div>
                  <div className="flex justify-end space-x-2 pt-2"><button type="submit" className="px-4 py-2 bg-emerald-600 text-white rounded-lg text-xs font-semibold">Guardar Tarea</button></div>
                </form>
              </div>
            </div>
          )}

          {showReportModal && selectedTask && (
            <div className="fixed inset-0 bg-slate-950/45 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white border rounded-2xl max-w-lg w-full p-6 shadow-xl space-y-4">
                <div className="flex justify-between items-center"><h3 className="font-bold text-slate-950">Reportar Avance</h3><button onClick={() => setShowReportModal(false)} className="text-slate-400">✕</button></div>
                <form onSubmit={handleSaveReport} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold mb-1">Estado</label>
                    <select value={reportData.status} onChange={e => setReportData({...reportData, status: e.target.value})} className="w-full border rounded-lg p-2 text-xs">
                      <option value="Pendiente">Pendiente</option>
                      <option value="En desarrollo">En desarrollo</option>
                      <option value="Listo">Listo</option>
                      <option value="Retrasado">Retrasado</option>
                    </select>
                  </div>
                  <div><label className="block text-xs font-semibold mb-1">Tiempo de Ejecución Invertido</label><input type="text" placeholder="Ej: 5 horas / 2 días" value={reportData.tiempoEjecucion} onChange={e => setReportData({...reportData, tiempoEjecucion: e.target.value})} className="w-full border rounded-lg p-2 text-xs" /></div>
                  <div><label className="block text-xs font-semibold mb-1">Avance Diario / Bitácora</label><textarea rows="2" value={reportData.dailyAdvance} onChange={e => setReportData({...reportData, dailyAdvance: e.target.value})} className="w-full border rounded-lg p-2 text-xs"></textarea></div>
                  <div><label className="block text-xs font-semibold mb-1">Observaciones / Obstáculos</label><textarea rows="2" value={reportData.observation} onChange={e => setReportData({...reportData, observation: e.target.value})} className="w-full border rounded-lg p-2 text-xs"></textarea></div>
                  <div><label className="block text-xs font-semibold mb-1">Enlace Adjunto (Drive / Canva / GitHub)</label><input type="text" placeholder="https://..." value={reportData.adjunto} onChange={e => setReportData({...reportData, adjunto: e.target.value})} className="w-full border rounded-lg p-2 text-xs" /></div>
                  <div className="flex justify-end space-x-2"><button type="submit" className="px-4 py-2 bg-emerald-600 text-white rounded-lg text-xs font-semibold">Actualizar</button></div>
                </form>
              </div>
            </div>
          )}

          {showCommentModal && selectedTask && (
            <div className="fixed inset-0 bg-slate-950/45 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white border rounded-2xl max-w-lg w-full p-6 shadow-xl space-y-4">
                <div className="flex justify-between items-center"><h3 className="font-bold text-slate-950">Retroalimentación / Supervisión</h3><button onClick={() => setShowCommentModal(false)} className="text-slate-400">✕</button></div>
                <form onSubmit={handleSaveComment} className="space-y-4">
                  <textarea required rows="4" placeholder="Observaciones, correcciones o sugerencias de mejora..." value={supervisorCommentText} onChange={(e) => setSupervisorCommentText(e.target.value)} className="w-full border rounded-lg p-2 text-sm" />
                  <div className="flex justify-end"><button type="submit" className="px-4 py-2 text-sm bg-emerald-600 text-white rounded-lg">Guardar Retroalimentación</button></div>
                </form>
              </div>
            </div>
          )}

          {showDailyReportModal && (
            <div className="fixed inset-0 bg-slate-950/45 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white border rounded-2xl max-w-5xl w-full p-6 shadow-xl space-y-5 max-h-[92vh] flex flex-col">
                <div className="flex justify-between items-center border-b pb-3">
                  <div>
                    <h3 className="font-bold text-slate-950 text-lg">Reporte Diario de Actividades</h3>
                    <p className="text-xs text-slate-500">Filtrado por rango de fechas y métricas de desempeño</p>
                  </div>
                  <button onClick={() => setShowDailyReportModal(false)} className="text-slate-400 font-bold text-lg hover:text-slate-700">✕</button>
                </div>

                <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3 items-end">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">Desde</label>
                    <input type="date" value={fechaDesde} onChange={e => setFechaDesde(e.target.value)} className="w-full border p-2 text-xs rounded-lg bg-white" />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">Hasta</label>
                    <input type="date" value={fechaHasta} onChange={e => setFechaHasta(e.target.value)} className="w-full border p-2 text-xs rounded-lg bg-white" />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">Proyecto</label>
                    <select value={reportProjectFilter} onChange={e => setReportProjectFilter(e.target.value)} className="w-full border p-2 text-xs rounded-lg bg-white font-medium">
                      <option value="Todos">Todos los Proyectos</option>
                      {PROYECTOS.map(p => <option key={p} value={p}>{p}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">Responsable</label>
                    <select value={reportWorkerFilter} onChange={e => setReportWorkerFilter(e.target.value)} className="w-full border p-2 text-xs rounded-lg bg-white font-medium">
                      <option value="Todos">Todos los Colaboradores</option>
                      {COLABORADORES.map(c => <option key={c.nombre} value={c.nombre}>{c.nombre}</option>)}
                    </select>
                  </div>
                  <div className="flex space-x-2">
                    <button onClick={() => fetchReporteDiario(fechaDesde, fechaHasta)} className="w-full px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold shadow-sm">🔍 Consultar</button>
                  </div>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
                  <div className="bg-slate-50 border border-slate-200 p-3 rounded-xl text-center"><p className="text-[10px] font-bold uppercase text-slate-500">Total Registros</p><p className="text-xl font-bold text-slate-900">{reportStats.total}</p></div>
                  <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-center"><p className="text-[10px] font-bold uppercase text-emerald-700">Listos</p><p className="text-xl font-bold text-emerald-800">{reportStats.listo}</p></div>
                  <div className="bg-sky-50 border border-sky-200 p-3 rounded-xl text-center"><p className="text-[10px] font-bold uppercase text-sky-700">En Desarrollo</p><p className="text-xl font-bold text-sky-800">{reportStats.enDesarrollo}</p></div>
                  <div className="bg-amber-50 border border-amber-200 p-3 rounded-xl text-center"><p className="text-[10px] font-bold uppercase text-amber-700">Pendientes</p><p className="text-xl font-bold text-amber-800">{reportStats.pendiente}</p></div>
                  <div className="bg-rose-50 border border-rose-200 p-3 rounded-xl text-center"><p className="text-[10px] font-bold uppercase text-rose-700">Retrasados</p><p className="text-xl font-bold text-rose-800">{reportStats.retrasado}</p></div>
                </div>

                <div className="flex justify-end space-x-2">
                  <button onClick={downloadODS} className="px-3.5 py-1.5 bg-sky-600 hover:bg-sky-700 text-white rounded-lg text-xs font-semibold shadow-sm flex items-center space-x-1"><span>📥 Descargar ODS</span></button>
                  <button onClick={downloadPDF} className="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold shadow-sm flex items-center space-x-1"><span>📄 Descargar PDF</span></button>
                </div>

                <div className="flex-1 overflow-y-auto border border-slate-200 rounded-xl">
                  {reporteDiarioFiltrado.length === 0 ? (
                    <p className="text-center text-slate-400 py-12 text-sm font-medium">No se encontraron registros con los filtros seleccionados.</p>
                  ) : (
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="border-b bg-slate-100 text-slate-600 text-xs font-bold uppercase sticky top-0">
                          <th className="p-3">Dependencia</th>
                          <th className="p-3">Fecha / Hora</th>
                          <th className="p-3">Proyecto</th>
                          <th className="p-3">Acción Específica</th>
                          <th className="p-3">Actividad</th>
                          <th className="p-3">Responsable(s)</th>
                          <th className="p-3">Estatus</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 text-xs bg-white text-slate-700">
                        {reporteDiarioFiltrado.map((r, i) => (
                          <tr key={i} className="hover:bg-slate-50/80">
                            <td className="p-3 font-semibold text-slate-600">{r.oficina || "OTC"}</td>
                            <td className="p-3 whitespace-nowrap text-slate-500">{formatearFechaHora(r.fecha || r.lastUpdated || "")}</td>
                            <td className="p-3"><span className="inline-flex px-2 py-0.5 rounded text-[11px] font-semibold bg-slate-100 border text-slate-600">{r.proyecto || r.project || "-"}</span></td>
                            <td className="p-3 font-medium text-slate-800">{r.accionEspecifica || "-"}</td>
                            <td className="p-3 font-semibold text-slate-900">{r.title || r.actividad || "-"}</td>
                            <td className="p-3 font-medium text-slate-700">{r.responsable || r.worker || "-"}</td>
                            <td className="p-3">
                              <span className={`px-2.5 py-0.5 rounded-full text-[11px] font-bold ${
                                (r.estatus || r.status) === 'Listo' ? 'bg-emerald-100 text-emerald-800' :
                                (r.estatus || r.status) === 'En desarrollo' ? 'bg-sky-100 text-sky-800' :
                                (r.estatus || r.status) === 'Retrasado' ? 'bg-rose-100 text-rose-800' : 'bg-slate-100 text-slate-800'
                              }`}>
                                {r.estatus || r.status || "Pendiente"}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              </div>
            </div>
          )}

          {showManagerModal && (
            <div className="fixed inset-0 bg-slate-950/45 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white border rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl flex flex-col">
                <div className="px-6 py-4 border-b bg-slate-50 flex items-center justify-between">
                  <h3 className="font-bold text-slate-950">Gestión de Validadores</h3>
                  <button onClick={() => setShowManagerModal(false)} className="text-slate-400 font-bold">✕</button>
                </div>
                <div className="p-6 space-y-6">
                  <form onSubmit={handleAgregarValidador} className="bg-slate-50 p-4 rounded-xl border space-y-4">
                    <p className="text-xs font-bold text-indigo-700 uppercase">➕ Registrar / Modificar Supervisor Técnico</p>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-500 mb-1">Coordinador</label>
                        <select value={nuevoValidador.nombreValidador} onChange={(e) => setNuevoValidador({...nuevoValidador, nombreValidador: e.target.value})} className="w-full bg-white border rounded-lg p-2 text-xs">
                          {COLABORADORES.map(c => <option key={c.nombre} value={c.nombre}>{c.nombre}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-500 mb-1">PIN de Acceso</label>
                        <input type="password" placeholder="Ej: 5533" value={nuevoValidador.pin} onChange={(e) => setNuevoValidador({...nuevoValidador, pin: e.target.value})} className="w-full bg-white border rounded-lg p-2 text-xs font-mono font-bold" />
                      </div>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1.5">Colaboradores bajo su supervisión:</label>
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                        {COLABORADORES.map(c => {
                          const estaMarcado = nuevoValidador.asignados.includes(c.nombre);
                          return (
                            <button type="button" key={`chk-${c.nombre}`} onClick={() => handleToggleAsignado(c.nombre)} className={`text-letf p-2 rounded-lg border text-xs font-medium flex items-center justify-between ${estaMarcado ? 'bg-indigo-50 border-indigo-400 text-indigo-950' : 'bg-white text-slate-600'}`}>
                              <span>{c.nombre}</span><span>{estaMarcado ? '✅' : '➕'}</span>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                    <div className="flex justify-end"><button type="submit" className="px-3 py-2 bg-indigo-600 text-white font-bold text-xs rounded-lg">Guardar Configuración</button></div>
                  </form>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
